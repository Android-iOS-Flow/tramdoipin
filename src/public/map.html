<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bản đồ Trạm VinFast</title>

    <!-- Goong JS CDN -->
    <!-- <script src="https://cdn.jsdelivr.net/npm/@goongmaps/goong-js@1.0.9/dist/goong-js.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/@goongmaps/goong-js@1.0.9/dist/goong-js.css" rel="stylesheet"> -->
    <link rel='stylesheet' href='https://unpkg.com/maplibre-gl/dist/maplibre-gl.css' />
    <script src='https://unpkg.com/maplibre-gl/dist/maplibre-gl.js'></script>

    <style>
        body {
            margin: 0;
            padding: 0;
        }

        #map {
            width: 100%;
            height: 100vh;
        }
    </style>
</head>

<body>
    <div class="map-header" id="header">
        📍 Đang tải bản đồ...
    </div>
    <div id="map"></div>

    <script>
        // ==================== CẤU HÌNH ====================
        const MAP_KEY = 'dMkBmAzI3MITq9ssuGvGJEJaChWUPjqjM9n0Hypi';        // ← Thay bằng Map Key của bạn
        const API_KEY = 'YOUR_API_KEY_HERE';        // ← Thay bằng API Key của bạn (nếu cần)

        // Lấy tham số từ URL (dùng cho Mini App)
        const urlParams = new URLSearchParams(window.location.search);
        const lat = parseFloat(urlParams.get('lat')) || 21.0285;
        const lng = parseFloat(urlParams.get('lng')) || 105.8542;
        const stationName = urlParams.get('name') || 'Trạm đổi pin VinFast';

        // Cập nhật header
        document.getElementById('header').innerHTML = `📍 ${stationName}`;

        // ==================== KHỞI TẠO BẢN ĐỒ ====================
        const map = new maplibregl.Map({
            container: 'map',
            style: `https://tiles.goong.io/assets/goong_map_web.json?api_key=${MAP_KEY}`,
            center: [lng, lat],           // [longitude, latitude]
            zoom: 16,
            attributionControl: false
        });

        // Thêm nút zoom + compass
        map.addControl(new maplibregl.NavigationControl(), 'top-right');

        // ==================== THÊM MARKER ====================
        map.on('load', () => {
            // Marker chính
            const marker = new maplibregl.Marker({ color: '#FF0000' })
                .setLngLat([lng, lat])
                .setPopup(
                    new maplibregl.Popup({ offset: 25 })
                        .setHTML(`
                            <b>${stationName}</b><br>
                            <small>Trạm đổi pin VinFast</small><br>
                            <a href="https://www.google.com/maps?q=${lat},${lng}" target="_blank">Mở Google Maps</a>
                        `)
                )
                .addTo(map);

            // Tự động mở popup
            marker.togglePopup();

            // Vẽ vòng tròn bán kính 300m (tùy chọn)
            addCircleLayer([lng, lat], 300);
        });

        // ==================== HÀM VẼ VÒNG TRÒN ====================
        function addCircleLayer(center, radiusMeters) {
            const points = 64;
            const coords = [];
            const km = radiusMeters / 1000;
            const latRad = center[1] * Math.PI / 180;

            for (let i = 0; i < points; i++) {
                const theta = (i / points) * (2 * Math.PI);
                const x = (km / (111.320 * Math.cos(latRad))) * Math.cos(theta);
                const y = (km / 110.574) * Math.sin(theta);
                coords.push([center[0] + x, center[1] + y]);
            }
            coords.push(coords[0]); // Đóng polygon

            const geojson = {
                type: 'FeatureCollection',
                features: [{
                    type: 'Feature',
                    geometry: { type: 'Polygon', coordinates: [coords] }
                }]
            };

            map.addSource('circle', { type: 'geojson', data: geojson });
            map.addLayer({
                id: 'circle-layer',
                type: 'fill',
                source: 'circle',
                paint: {
                    'fill-color': '#00AAFF',
                    'fill-opacity': 0.25
                }
            });
        }

        // ==================== XỬ LÝ LỖI ====================
        map.on('error', (e) => {
            console.error('Map error:', e);
            document.getElementById('header').innerHTML = '❌ Lỗi tải bản đồ. Vui lòng thử lại.';
        });
    </script>
</body>

</html>
